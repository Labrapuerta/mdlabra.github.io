services:
  site:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${SITE_PORT:-8000}:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
